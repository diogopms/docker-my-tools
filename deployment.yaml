apiVersion: apps/v1
kind: Deployment
metadata:
  name: diogopms-my-tools
  labels:
    app: diogopms-my-tools
spec:
  replicas: 1
  selector:
    matchLabels:
      app: diogopms-my-tools
  template:
    metadata:
      labels:
        app: diogopms-my-tools
    spec:
      containers:
      - name: my-docker-my-tools
        image: ghcr.io/diogopms/docker-my-tools:latest
        # Keep the container alive so it can be exec'd into at any time
        command: ["sleep", "infinity"]
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
